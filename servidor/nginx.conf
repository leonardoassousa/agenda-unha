# Agenda de unhas · site no Nginx. O instalar.sh copia pra /etc/nginx/sites-available/agenda-unhas
# trocando __DOMINIO__ pelo domínio do estúdio. Depois o certbot acrescenta o HTTPS aqui mesmo.
server {
    listen 80;
    server_name __DOMINIO__ www.__DOMINIO__;

    root /var/www/agenda-unhas;
    include snippets/agenda-seguranca.conf;
    index index.php;
    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ =404;
    }

    # Só as páginas do sistema executam PHP (pool próprio, usuário agenda)
    location ~ ^/(index|api|manifest)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/agenda.sock;
    }
    location ~ ^/(admin|equipe)/[a-z]+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/agenda.sock;
    }

    # Qualquer outro .php (config.php, includes, cron...) nunca abre nem é baixado
    location ~ \.php$ {
        return 404;
    }
}
