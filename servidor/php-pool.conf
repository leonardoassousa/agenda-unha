; Agenda de unhas · pool PHP só do site (usuário próprio, sem rodar comandos do sistema)
; O instalar.sh copia pra /etc/php/<versão>/fpm/pool.d/agenda.conf
[agenda]
user = agenda
group = agenda
listen = /run/php/agenda.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 60s

; O PHP só enxerga a pasta do site (+ temporários, sessões e fusos)
php_admin_value[open_basedir] = /var/www/agenda-unhas/:/tmp/:/var/lib/php/agenda-sessoes/:/usr/share/zoneinfo/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,putenv,show_source,highlight_file,phpinfo
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/agenda-unhas/php.log
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M
php_admin_value[max_file_uploads] = 2
php_admin_value[memory_limit] = 192M

; Sessões numa pasta só da agenda: o Ubuntu apaga as sessões da pasta padrão depois de 24 minutos,
; e aqui o login da equipe e das clientes precisa durar 30 dias.
php_admin_value[session.save_path] = /var/lib/php/agenda-sessoes
php_admin_value[session.gc_maxlifetime] = 2592000
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 200
php_admin_flag[session.use_strict_mode] = on
