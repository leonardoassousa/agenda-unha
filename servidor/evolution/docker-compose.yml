# Evolution API (WhatsApp) pra agenda: avisos no grupo da equipe e lembrete das clientes.
# Fica só no próprio servidor (127.0.0.1:8080); a agenda conversa com ela por dentro, sem abrir porta.
# Uso: copie o .env.exemplo pra .env, troque as senhas e rode: docker compose up -d
services:
  evolution:
    image: ${EVOLUTION_IMAGE}
    container_name: agenda_evolution
    restart: always
    ports:
      - '127.0.0.1:8080:8080'
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - evolution_instances:/evolution/instances
    logging: &logs
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: postgres:16-alpine
    container_name: agenda_evolution_db
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    logging: *logs

  redis:
    image: redis:7-alpine
    container_name: agenda_evolution_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    logging: *logs

volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:
