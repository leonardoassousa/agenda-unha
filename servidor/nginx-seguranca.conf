# Agenda de unhas · regras de segurança do site (incluído dentro do server {} da agenda)
# O instalar.sh copia pra /etc/nginx/snippets/agenda-seguranca.conf

# Freio de pedidos por IP (definido em /etc/nginx/conf.d/agenda-http.conf)
limit_req zone=agenda_geral burst=60 nodelay;
limit_req_status 429;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# Fotos da equipe: só imagem com o nome que o sistema gera. Qualquer outra coisa = 404.
location ^~ /uploads/ {
    location ~* ^/uploads/profissionais/[0-9]+-[a-f0-9]+\.(jpe?g|png|webp)$ {
        expires 30d;
    }
    return 404;
}

# Fontes e ícones mudam pouco: o celular guarda por 30 dias
location ^~ /assets/fonts/ {
    expires 30d;
}
location ^~ /assets/icones/ {
    expires 30d;
}

# Pastas e arquivos internos (código, banco, scripts, anotações) nunca são servidos
location ~ ^/(includes|sql|cron|servidor|previa)(/|$) {
    return 404;
}
location ~ /\. {
    return 404;
}
location ~* \.(sql|sh|md|bat|ini|log|bak|old|orig|swp|dist|env|lock|gz|zip|tgz|json)$ {
    return 404;
}
location = /VERSION {
    return 404;
}
